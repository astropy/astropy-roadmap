# Records the roadmap from GitHub in roadmap.yaml.
#
# Weekly or on demand: read the objectives and key results from the issues in
# this repository and their ranking from the project board, write them to
# roadmap.yaml, and open or update a pull request with the changes, and any
# warnings, for the SPOC to merge. The web page is built by Read
# the Docs from roadmap.yaml, so nothing generated is committed. If an issue
# title is wrong, the problems are reported in a "Roadmap snapshot failed"
# issue, which the next successful run closes.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be enabled. The default token cannot read project boards, so
# the pull step uses the ROADMAP_TOKEN secret, a personal access token that can
# read the issues and the board; README.md describes how to create it.
#
# GitHub turns off scheduled workflows in a public repository after 60 days
# without commits, which would happen whenever the roadmap does not change for
# that long. Each run therefore re-enables this workflow, which resets the count.
name: Roadmap

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      FAILURE_TITLE: Roadmap snapshot failed
    steps:
      - name: Keep the weekly schedule from being turned off
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/roadmap.yml/enable"
      # Always check out main, so that re-running an old run starts from the
      # current snapshot rather than the commit the run was first started on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - run: pip install ruamel.yaml jinja2
      - run: python roadmap.py 2>&1 | tee pull.log
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_TOKEN }}
      - name: Report the problems in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The roadmap snapshot could not be written ([log]($RUN_URL))."
            echo "Fix the issues below; the next run will try again."
            echo
            sed 's/^/- /' pull.log
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$FAILURE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$FAILURE_TITLE" --body-file body.md
          fi
      - name: Close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$FAILURE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The roadmap snapshot succeeded again."
          fi
      - name: Write the pull request description
        run: |
          {
            if [ -s pull.log ]; then
              echo "Warnings:"
              echo
              sed 's/^/- /' pull.log
              echo
            fi
            echo "The roadmap issues or project board changed; see the diff of roadmap.yaml."
          } > body.md
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: roadmap-snapshot
          add-paths: roadmap.yaml
          commit-message: Record the roadmap from GitHub
          title: Record the roadmap from GitHub
          body-path: body.md
          delete-branch: true
