# The wording of the published roadmap page: the sections before the objectives are
# for readers, and those after them explain where the roadmap comes from. The objectives
# and key results themselves are GitHub issues; roadmap.yaml is a snapshot of them
# written by roadmap.py.
title: The Astropy Roadmap

before_objectives:
- title: Introduction
  text: |
    This Roadmap captures the high level objectives that the Astropy Project aims to achieve to improve the health and stability of the Project, together with the key results we will use to measure progress towards each objective. It is maintained by the Strategic Planning and Organizing Committee (SPOC), which revisits it at least once a year at the Astropy coordination meeting and updates it whenever needed.

    The Roadmap is used to prioritize the allocation of Project resources. In particular, funding requests submitted in response to the Project's funding calls are asked to identify which key results they address.
- title: How to read this document
  text: |
    Each **objective** is a qualitative goal that describes a state we want the Project to reach. Each objective has up to five **key results**: concrete, measurable outcomes that, taken together, tell us whether the objective has been achieved. A key result is a single sentence that contains its own measure of success, for example a number, a published document, or a merged and released feature. Some key results have extra detail, shown in italics underneath.

    Every objective has an identifier such as `O3` and every key result has an identifier such as `KR3.2`. Identifiers are stable: once assigned they are never renumbered or reused, so they can be cited in funding requests, issues, and pull requests without ambiguity.

    Open objectives are ranked by the SPOC, with rank 1 the highest priority, and are listed in rank order. The rank reflects how important the SPOC considers it that progress is made before the roadmap is next revisited, independent of whether anyone is currently working on it.

    Key results and objectives are marked as completed once they have been achieved, and completed objectives are listed after the open ones. An objective or key result that no longer applies is marked as not planned and kept on this page as a record.

objectives_intro: Open objectives are listed in order of priority.

after_objectives:
- title: Where this roadmap is maintained
  text: |
    Each objective and key result is an issue in the [astropy-roadmap repository](https://github.com/astropy/astropy-roadmap) on GitHub, linked from this page. Comments on those issues are the place for status updates, links to funded work, and links to implementation pull requests. The SPOC sets the ranking of the objectives on the roadmap's [project board](https://github.com/orgs/astropy/projects/16).

    This page is generated from the issues and the project board, and the date at the top is when they last changed. The repository's README explains how objectives and key results are added and updated.

footer: Objectives and key results are maintained by the Astropy Strategic Planning and Organizing Committee.
